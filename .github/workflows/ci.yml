name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Maven, Testcontainers)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compiler et lancer tous les tests
        run: ./mvnw -B -ntp verify
      - name: Nombre de tests
        if: always()
        run: python3 ../scripts/resume-tests-maven.py target/surefire-reports
      - name: Conserver les rapports en cas d'echec
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rapports-surefire
          path: backend/target/surefire-reports/
          retention-days: 7

  frontend:
    name: Frontend (lint, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer les dependances sans executer leurs scripts
        run: npm ci --ignore-scripts --no-audit
      - name: Audit des dependances
        run: npm audit --audit-level=high
      - name: ESLint
        run: npm run lint
      - name: Tests unitaires (Vitest)
        run: npm test
      - name: Build de production
        run: npm run build

  e2e:
    name: Parcours e2e (docker compose, Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Installer Playwright et Chromium
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit
          npx playwright install --with-deps chromium
      - name: Demarrer base, API et interface
        run: docker compose up -d --build --wait --wait-timeout 300
      - name: Parcours Playwright
        working-directory: frontend
        env:
          LANG: fr_FR.UTF-8
          LANGUAGE: fr_FR:fr
        run: npm run e2e
      - name: Conserver les captures
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: captures-e2e
          path: |
            frontend/e2e/captures/
            frontend/playwright-report/
            frontend/test-results/
          retention-days: 14
      - name: Journaux des conteneurs
        if: failure()
        run: docker compose logs --no-color
